name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Unit tests
        run: pytest tests/unit --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Postgres + RabbitMQ in containers, real worker, mock health plan
        run: pytest -m integration tests/integration -v

  docker-e2e:
    name: Docker image and end-to-end tests
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - name: Configure dev environment
        run: |
          cp .env.example .env
          # CI must not depend on the public FHIR server; use the mock's fake patients.
          sed -i 's#^FHIR_BASE_URL=.*#FHIR_BASE_URL=http://mock-payer:8081/fhir#' .env
      - name: Build the Docker image
        run: docker compose build api
      - name: Start the stack
        run: docker compose up -d --wait postgres rabbitmq mock-payer api worker jaeger
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx
      - name: End-to-end tests
        run: pytest -m e2e tests/e2e -v
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color api worker mock-payer
      - if: always()
        run: docker compose down -v

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
