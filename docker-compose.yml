# docker compose up --build
#   API + Swagger UI   http://localhost:8080/docs
#   RabbitMQ UI        http://localhost:15672   (guest / guest)
#   Grafana            http://localhost:3000    (admin / GRAFANA_ADMIN_PASSWORD from .env)
#   Jaeger (traces)    http://localhost:16686
#   Prometheus         http://localhost:9090
#   Mock health plan   http://localhost:8081/docs

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://priorauth:priorauth@postgres:5432/priorauth
  AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
  PAYER_BASE_URL: http://mock-payer:8081
  PAYER_TIMEOUT_SECONDS: ${PAYER_TIMEOUT_SECONDS:-2}
  FHIR_BASE_URL: ${FHIR_BASE_URL:-https://hapi.fhir.org/baseR4}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
  RETRY_DELAY_MS: ${RETRY_DELAY_MS:-5000}
  JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env first}
  DEMO_USERS: ${DEMO_USERS:-}
  API_KEYS: ${API_KEYS:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: priorauth
      POSTGRES_PASSWORD: priorauth
      POSTGRES_DB: priorauth
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priorauth"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30

  mock-payer:
    build: .
    image: priorauth-gateway:local
    command: ["uvicorn", "priorauth.mock_payer.main:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      MOCK_TIMEOUT_SLEEP_SECONDS: "10"
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: priorauth-gateway:local
    environment:
      <<: *app-env
      SERVICE_NAME: priorauth-api
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    build: .
    image: priorauth-gateway:local
    command: ["python", "-m", "priorauth.worker.main"]
    environment:
      <<: *app-env
      SERVICE_NAME: priorauth-worker
    ports: ["9100:9100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api: { condition: service_healthy } # the API runs the migrations
      mock-payer: { condition: service_healthy }

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
